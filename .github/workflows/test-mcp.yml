name: MCP Test Automation

# Generates the MCP test suites and reports on the project structure. The
# real test suite runs in `ci.yml` — this workflow is advisory only, so a
# failure here never blocks a pull request.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    name: Analyse & generate the MCP test suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-test-server/package-lock.json

      - name: Install the MCP server
        run: |
          cd mcp-test-server
          npm ci
        continue-on-error: true

      - name: Run the full pipeline
        if: hashFiles('mcp-test-server/package-lock.json') != ''
        working-directory: mcp-test-server
        run: npm run testall
        continue-on-error: true

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-test-report
          path: /tmp/notion-clone-report.md
          if-no-files-found: ignore
          retention-days: 7
